services:
  md-editor:
    image: ghcr.io/mazaiguo/mdeditor:latest
    container_name: md-editor
    restart: unless-stopped
    pull_policy: always
    ports:
      - "5080:5080"
    environment:
      - PORT=5080
      - TZ=Asia/Shanghai
      # Restrict /api/local-image & /api/save-image to the mounted volume
      - IMAGE_ROOT=/app/dist/images
    volumes:
      # Persist images uploaded via the editor so they survive image upgrades
      - md-editor-images:/app/dist/images
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  md-editor-images:
